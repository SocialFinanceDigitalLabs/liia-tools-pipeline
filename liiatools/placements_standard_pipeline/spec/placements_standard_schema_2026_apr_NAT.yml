column_map:
  placements_standard:
    child_ID:
      string: "alphanumeric"
      header_regex:
        - /^child_ID\b/i
      canbeblank: False
    when_placement_is_needed_by:
      category:
        - code: "Today"
        - code: "< 5 days"
        - code: "> 5 days"
      header_regex:
        - /^when_placement_is_needed_by\b/i
      canbeblank: False
    number_of_siblings_to_place_with:
      numeric:
        type: "integer"
        min_value: 0
      header_regex:
        - /^number_of_siblings_to_place_with\b/i
      canbeblank: False
    preferred_location_for_home_search:
      category:
        - code: "Yes"
        - code: "No"
      header_regex:
        - /^preferred_location_for_home_search\b/i
      canbeblank: False
    preferred_location_for_outside_LA_home_search_reason:
      category:
        - code: "Safeguarding concerns"
        - code: "Bail conditions"
        - code: "Court order"
        - code: "Other"
        - code: "N/A"
      header_regex:
        - /^preferred_location_for_outside_LA_home_search_reason\b/i
      canbeblank: True
    communication_language_learning_needs:
      category:
        - code: "Yes"
        - code: "No"
        - code: "Not specified"
      header_regex:
        - /^communication_language_learning_needs\b/i
      canbeblank: False
    specific_communication_and_language_requirements:
      category:
        - code: "ESOL"
        - code: "BSL"
        - code: "Makaton"
        - code: "Other"
        - code: "None"
      header_regex:
        - /^specific_communication_and_language_requirements\b/i
      canbeblank: False
    adaptation_to_the_home:
      category:
        - code: "Yes"
        - code: "No"
      header_regex:
        - /^adaptation_to_the_home\b/i
      canbeblank: False
    cultural_needs:
      category:
        - code: "Required"
        - code: "Not required"
        - code: "Not known"
        - code: "Other"
      header_regex:
        - /^cultural_needs\b/i
      canbeblank: False
    who_can_the_child_be_cared_for_alongside:
      category:
        - code: "Solo placement recommended"
        - code: "With other children recommended"
        - code: "Only with other older children"
        - code: "Only with other younger children"
        - code: "No preference"
